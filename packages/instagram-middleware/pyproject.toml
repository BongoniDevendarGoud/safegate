[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safegate-instagram"
version = "0.1.0"
description = "SafeGate Instagram Integration Middleware: Pre-publication media integrity firewall for Instagram Graph API & Webhook pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "safegate-sdk>=0.1.0",
]
